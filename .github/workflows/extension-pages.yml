# Keeps the extension pages consistent with the catalog and the navigation.
#
# Each extension has one body in snippets/extensions/, and
# scripts/gen-extension-pages.py writes the per-slot pages and the Extensions
# groups in docs.json from it. Because that output is committed, it can drift:
# someone edits a generated page directly, adds a catalog entry without a body,
# or changes a body and does not re-run the script.
#
# This job runs the script and fails when it produces a diff, so the drift shows
# up on the pull request instead of shipping.
name: "Extension pages"
on:
  pull_request:
    paths:
      - "snippets/extensions/**"
      - "snippets/extensions-en.mdx"
      - "scripts/gen-extension-pages.py"
      - "scripts/extension-pages.json"
      - "docs.json"
      - ".github/workflows/extension-pages.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-files-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: "Regenerate and compare"
        run: |
          python3 scripts/gen-extension-pages.py
          if ! git diff --exit-code; then
            echo "::error::The committed extension pages do not match the generator."
            echo "Run: python3 scripts/gen-extension-pages.py, then commit the result."
            exit 1
          fi
