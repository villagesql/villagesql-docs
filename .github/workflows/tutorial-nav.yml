# Keeps the tutorial navigation, and the practice seed, consistent with what is
# on disk.
#
# The curriculum order lives in scripts/tutorial-toc.json, and
# scripts/gen-tutorial-nav.py writes it into the Tutorial group in docs.json
# and into the contents list on tutorial/index.mdx. Because that output is
# committed, it can drift: someone adds a lesson without re-running the script,
# reorders the manifest and forgets the hub page, or edits the generated
# contents list by hand.
#
# This job runs the script and fails when it produces a diff, so the drift shows
# up on the pull request instead of shipping a sidebar that disagrees with the
# table of contents.
name: "Tutorial navigation"
on:
  pull_request:
    paths:
      - "tutorial/**"
      - "scripts/gen-tutorial-nav.py"
      - "scripts/tutorial-toc.json"
      - "scripts/check-practice-seed.py"
      - "scripts/tutorial-practice.sql"
      - "docs.json"
      - ".github/workflows/tutorial-nav.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-files-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: "Regenerate and compare"
        run: |
          python3 scripts/gen-tutorial-nav.py
          if ! git diff --exit-code; then
            echo "::error::The committed tutorial navigation does not match the generator."
            echo "Run: python3 scripts/gen-tutorial-nav.py, then commit the result."
            exit 1
          fi
      - name: "The practice seed matches the block readers run"
        run: |
          if ! python3 scripts/check-practice-seed.py; then
            echo "::error::scripts/tutorial-practice.sql and tutorial/insert.mdx disagree."
            exit 1
          fi
